$schema: https://json-schema.org/draft/2020-12/schema
$id: repo-profile.schema.yaml
title: Repo Profile Config
type: object
additionalProperties: false
required:
  - version
  - kind
  - repository
  - branch_policy
  - paths
  - ownership
  - commands
  - generated_output_policy
properties:
  version:
    const: 1
  kind:
    const: repo-profile
  agentsmyth_version:
    type: string
    description: Version of the agentsmyth package that last wrote or initialized this file. Used to detect version skew between the installed CLI and the managed workflow definitions.
  repository:
    type: object
    additionalProperties: false
    required:
      - mode
      - root
      - default_branch
      - workflow_root
      - artifacts_root
      - learnings_sessions_root
    properties:
      mode:
        enum:
          - single-repository
          - monorepo
          - polyrepo-member
        description: What this workflow install's own scope is — not the surrounding git tree's overall shape. A monorepo package or polyrepo member each declare the mode that describes their own install; workflow/ placement stays git-top-level (monorepo) or workspace-root (polyrepo-member) regardless (see WP-R5 spike).
      root:
        type: string
      default_branch:
        type: string
        minLength: 1
      workflow_root:
        type: string
      artifacts_root:
        type: string
      learnings_sessions_root:
        type: string
      definitions_root:
        type: string
        description: Absolute path to the global agentsmyth definitions tree (e.g. ~/.agentsmyth/workflow). When present, skills/schemas/validators are loaded from here instead of the repo-local workflow/ directory.
      packages:
        type: array
        description: Informational, meaningful under mode monorepo. Lets the agent read the real package list instead of re-discovering it via glob every invocation. Does not change where workflow/ or artifacts live — still git top-level, per the WP-R5 spike.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - path
          properties:
            name:
              type: string
            path:
              type: string
            package_manager:
              type: string
      workspace_root:
        type: string
        description: Where the shared workflow/ actually lives for a polyrepo-member install (WP-R5 T5.2) — a parent directory containing this repo and its siblings as children, not a subdirectory of this repo's own git root. Not schema-enforced as required under mode polyrepo-member (this repo's hand-rolled schema engine has no if/then conditional support); a polyrepo-member profile with no workspace_root simply falls through to git-top-level detection, which resolves to this repo's own root, not the shared one — a known, documented limitation, not a silent failure.
      sibling_repos:
        type: array
        description: Informational, meaningful under mode polyrepo-member. Names related repos sharing conventions. path is the local checkout location relative to workspace_root, required because git-dependent validators need a real working tree to run against — url alone cannot drive a local git status/diff call.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - path
          properties:
            name:
              type: string
            path:
              type: string
            url:
              type: string
  branch_policy:
    type: object
    additionalProperties: false
    required:
      - require_non_default_branch_for_changes
      - default_branch_commit_requires_user_approval
      - preserve_unrelated_changes
      - dirty_state_policy
      - stage_only_approved_scope
      - branch_name_pattern
    properties:
      require_non_default_branch_for_changes:
        type: boolean
      default_branch_commit_requires_user_approval:
        type: boolean
      preserve_unrelated_changes:
        type: boolean
      dirty_state_policy:
        type: string
        enum:
          - record-and-preserve
          - block-when-dirty
      stage_only_approved_scope:
        type: boolean
      branch_name_pattern:
        type: string
  paths:
    type: object
    additionalProperties: false
    required:
      - protected
      - public_contracts
      - generated_outputs
      - test_roots
      - docs_roots
      - source_roots
    properties:
      protected:
        type: array
        items:
          $ref: '#/$defs/path_rule'
      public_contracts:
        type: array
        items:
          $ref: '#/$defs/path_rule'
      generated_outputs:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - path
            - source
            - regeneration_command
          properties:
            path:
              type: string
            source:
              type: string
            regeneration_command:
              type:
                - string
                - 'null'
            owner:
              type: string
            manual_edits_allowed:
              type: boolean
      test_roots:
        type: array
        items:
          type: string
      docs_roots:
        type: array
        items:
          type: string
      source_roots:
        type: array
        items:
          type: string
  ownership:
    type: object
    additionalProperties: false
    required:
      - default_owner
      - codeowners_file
      - path_owners
    properties:
      default_owner:
        type: string
      codeowners_file:
        type:
          - string
          - 'null'
      path_owners:
        type: array
        items:
          $ref: '#/$defs/path_rule'
  commands:
    type: object
    additionalProperties: false
    required:
      - discovery
      - package_managers
    properties:
      discovery:
        type: object
        additionalProperties: false
        required:
          - allow_repo_inspection
          - prefer_configured_verification_commands
          - do_not_invent_commands
        properties:
          allow_repo_inspection:
            type: boolean
          prefer_configured_verification_commands:
            type: boolean
          do_not_invent_commands:
            type: boolean
      package_managers:
        type: array
        items:
          type: string
  generated_output_policy:
    type: object
    additionalProperties: false
    required:
      - require_source_mapping
      - require_regeneration_or_waiver_when_source_changes
      - manual_edits_allowed
    properties:
      require_source_mapping:
        type: boolean
      require_regeneration_or_waiver_when_source_changes:
        type: boolean
      manual_edits_allowed:
        type: string
        enum:
          - always
          - never
          - only_when_configured
  extensions:
    type: object
    additionalProperties: true
$defs:
  path_rule:
    type: object
    additionalProperties: false
    required:
      - pattern
      - reason
    properties:
      pattern:
        type: string
      reason:
        type: string
      owner:
        type: string
