$schema: https://json-schema.org/draft/2020-12/schema
$id: artifact-frontmatter.schema.yaml
title: Lifecycle Artifact Frontmatter
type: object
additionalProperties: false
required:
  - slug
  - version
  - artifact
  - status
  - created
  - updated
  - manifest_ids
  - upstream
  - orchestration
properties:
  slug:
    type: string
    minLength: 1
    pattern: '^[a-z0-9][a-z0-9-]*$'
  version:
    oneOf:
      - type: integer
        minimum: 1
      - type: string
        minLength: 1
  artifact:
    type: string
    enum:
      - brief
      - plan
      - task
      - review
      - verify
      - ship
      - reflect
  status:
    type: string
    enum:
      - draft
      - in-progress
      - blocked
      - blocked-for-user
      - ready-for-next-phase
      - done
  created:
    type: string
    # Was `format: date-time`, which validateSchema does not implement and which the real corpus
    # never matched anyway (artifacts carry both `2026-08-12` and `2026-05-28T00:00:00Z`). A
    # pattern is enforceable today and accepts both forms — WP-R8 Review F5.
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ].*)?$'
  updated:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ].*)?$'
  manifest_ids:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: '^R(I)?[0-9]+$'
  upstream:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  target_repo:
    type: string
    minLength: 1
    description: Which polyrepo member repo this artifact's work targets — matches a repo-profile.yaml sibling_repos[].name, or omitted to mean the repo whose own workflow/ this artifact lives under. Only meaningful when the active repo-profile.yaml is mode polyrepo-member; ignored otherwise. Drives which member checkout git-dependent validators (trackedFiles, check-lifecycle.mjs's staged-diff detection) run against, since the shared workflow/artifacts/ tree doesn't itself say which repo a given task belongs to.
  orchestration:
    type: object
    additionalProperties: false
    required:
      - phase
      - status
      - next_phase
      - blockers
      - user_checkpoint
    properties:
      phase:
        type: string
        enum:
          - think
          - plan
          - build
          - review
          - test
          - ship
          - reflect
      status:
        type: string
        enum:
          - draft
          - in-progress
          - blocked
          - blocked-for-user
          - ready-for-next-phase
          - done
      next_phase:
        type: string
        enum:
          - plan
          - build
          - review
          - test
          - ship
          - reflect
          - done
      blockers:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      user_checkpoint:
        type: string
        minLength: 1
  skill_trigger_log:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - skill
        - decision
        - reason
      properties:
        skill:
          type: string
          minLength: 1
        signals:
          type: object
          additionalProperties: true
        decision:
          type: string
          enum:
            - ran
            - skipped
        reason:
          type: string
          minLength: 1
  council:
    type: object
    additionalProperties: false
    description: >-
      Council-mode run summary (WP-R21). OPTIONAL - a brief written before 1.1.0, or by the
      single-agent path, omits it entirely and still validates. Its presence is what makes a council
      run distinguishable from a single-agent run by frontmatter alone, with no prose inspection.
      The per-round detail lives in the body's `## Council Log` section; this block is the summary.
    required:
      - mode
    properties:
      mode:
        type: string
        enum:
          - council
          - single-agent
          - refused
        description: >-
          `refused` records that the council was applicable but did not fire, and requires
          refusal_reason. Silence cannot distinguish "not applicable" from "failed to fire", which
          is why a refusal is a recorded mode rather than an absent block.
      refusal_reason:
        type: string
        enum:
          - dispatch-disabled
          - council-disabled
          - not-complex
          - cannot-log
          - buckets-not-independent
          - bucket-dependency
      authorization:
        type: string
        enum:
          - carve-out
          - explicit
      cap_resolved:
        type: integer
        minimum: 0
      cap_source:
        type: string
        enum:
          - configured
          - council-default
        description: >-
          `council-default` means no max_parallel_workstreams was declared anywhere and the council
          fell back to its own default. Recorded because that fallback costs an unconfigured
          consumer real tokens they did not choose to spend.
      depth:
        type: string
        enum:
          - shallow
          - standard
          - deep
      dispatch_depth:
        type: integer
        minimum: 1
        maximum: 1
        description: Always 1. Council members do not dispatch; recording it makes a nesting violation a stated fact rather than an inference from an unexpected bill.
      rounds_run:
        type: integer
        minimum: 0
      termination_reason:
        type: string
        enum:
          - resolved
          - user-decision-required
          - max-rounds
          - no-progress
      evidence_classes:
        type: object
        additionalProperties: false
        description: Per-class runtime availability. A class requested during classification but absent from this map is invalid - it must be recorded as unavailable rather than silently dropped.
        properties:
          repo:
            type: string
            enum: [used, unused, unavailable]
          trial:
            type: string
            enum: [used, unused, unavailable]
          web:
            type: string
            enum: [used, unused, unavailable]
          recall:
            type: string
            enum: [used, unused, unavailable]
