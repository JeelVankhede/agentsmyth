$schema: https://json-schema.org/draft/2020-12/schema
$id: artifact-frontmatter.schema.yaml
title: Lifecycle Artifact Frontmatter
type: object
additionalProperties: false
required:
  - slug
  - version
  - artifact
  - status
  - created
  - updated
  - manifest_ids
  - upstream
  - orchestration
properties:
  slug:
    type: string
    minLength: 1
    pattern: '^[a-z0-9][a-z0-9-]*$'
  version:
    oneOf:
      - type: integer
        minimum: 1
      - type: string
        minLength: 1
  artifact:
    type: string
    enum:
      - brief
      - plan
      - task
      - review
      - verify
      - ship
      - reflect
  status:
    type: string
    enum:
      - draft
      - in-progress
      - blocked
      - blocked-for-user
      - ready-for-next-phase
      - done
  created:
    type: string
    # Was `format: date-time`, which validateSchema does not implement and which the real corpus
    # never matched anyway (artifacts carry both `2026-08-12` and `2026-05-28T00:00:00Z`). A
    # pattern is enforceable today and accepts both forms.
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ].*)?$'
  updated:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ].*)?$'
  manifest_ids:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: '^R(I)?[0-9]+$'
  upstream:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  target_repo:
    type: string
    minLength: 1
    description: Which polyrepo member repo this artifact's work targets — matches a repo-profile.yaml sibling_repos[].name, or omitted to mean the repo whose own workflow/ this artifact lives under. Only meaningful when the active repo-profile.yaml is mode polyrepo-member; ignored otherwise. Drives which member checkout git-dependent validators (trackedFiles, check-lifecycle.mjs's staged-diff detection) run against, since the shared workflow/artifacts/ tree doesn't itself say which repo a given task belongs to.
  orchestration:
    type: object
    additionalProperties: false
    required:
      - phase
      - status
      - next_phase
      - blockers
      - user_checkpoint
    properties:
      phase:
        type: string
        enum:
          - think
          - plan
          - build
          - review
          - test
          - ship
          - reflect
      status:
        type: string
        enum:
          - draft
          - in-progress
          - blocked
          - blocked-for-user
          - ready-for-next-phase
          - done
      next_phase:
        type: string
        enum:
          - plan
          - build
          - review
          - test
          - ship
          - reflect
          - done
      blockers:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      user_checkpoint:
        type: string
        minLength: 1
  skill_trigger_log:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - skill
        - decision
        - reason
      properties:
        skill:
          type: string
          minLength: 1
        signals:
          type: object
          additionalProperties: true
        decision:
          type: string
          enum:
            - ran
            - skipped
        reason:
          type: string
          minLength: 1
  council:
    type: object
    additionalProperties: false
    description: >-
      Council-mode run summary. OPTIONAL - a brief written before this field existed, or by the
      single-agent path, omits it entirely and still validates. Its presence is what makes a council
      run distinguishable from a single-agent run by frontmatter alone, with no prose inspection.
      The per-round detail lives in the body's `## Council Log` section; this block is the summary.
    required:
      - mode
    properties:
      mode:
        type: string
        enum:
          - council
          - single-agent
          - refused
        description: >-
          `refused` records that the council was applicable but did not fire, and requires
          refusal_reason. Silence cannot distinguish "not applicable" from "failed to fire", which
          is why a refusal is a recorded mode rather than an absent block.
      refusal_reason:
        type: string
        enum:
          - dispatch-disabled
          - council-disabled
          - not-complex
          - cannot-log
          - buckets-not-independent
          - bucket-dependency
      authorization:
        type: string
        enum:
          - carve-out
          - explicit
      cap_resolved:
        type: integer
        minimum: 0
      cap_source:
        type: string
        enum:
          - configured
          - council-default
        description: >-
          `council-default` means no max_parallel_workstreams was declared anywhere and the council
          fell back to its own default. Recorded because that fallback costs an unconfigured
          consumer real tokens they did not choose to spend.
      depth:
        type: string
        enum:
          - shallow
          - standard
          - deep
      effort:
        type: string
        enum:
          - low
          - standard
          - high
          - very-high
          - max
        description: >-
          The reasoning level this run REQUESTED for its members. Recorded separately from
          model_tier because they are independent axes; a record carrying one and not the other
          describes half the dispatch. Optional, so earlier council records stay valid.
      model_tier:
        type: string
        enum:
          - cheap
          - standard
          - deep
        description: >-
          The capability tier this run REQUESTED for its members, resolved global-then-repo-local.
          Optional, so every council record written before this key existed stays valid.
      model_actual:
        type: string
        minLength: 1
        description: >-
          What the host reports members actually ran on, or the literal `unknown` when it reports
          nothing. Separate from model_tier because a tier is a request, not a guarantee: some hosts
          replace a declared model by plan or administrator policy, so recording the request as
          though it were the outcome would state external state without evidence. `unknown` is an
          honest value here and must not be inferred from the tier.
      overrides:
        type: object
        additionalProperties: false
        description: >-
          Values this RUN departed from the resolved configuration, for this run only. Absent means
          no departure, and absence must never be read as one. Permitted rather than prompted: a gate
          whose most common answer restores the status quo trains bypass, so the control is a
          mandatory record rather than a mandatory question.
        properties:
          model_tier:
            type: string
            enum: [cheap, standard, deep]
          effort:
            type: string
            enum: [low, standard, high, very-high, max]
          depth:
            type: string
            enum: [shallow, standard, deep]
      override_reason:
        type: string
        minLength: 1
        description: >-
          Why this run departed from configuration. Required whenever `overrides` carries anything,
          and enforced by check-council-record rather than by review: an override that is easy to set
          and easy to forget is a spend with no owner.
      member_tokens:
        type: object
        description: >-
          Tokens each member actually consumed, keyed by member id, as reported by the host. The
          literal `unavailable` is a valid value and the honest one where a host reports nothing —
          never zero, which would be averaged in as though it were a measurement and would drag every
          later estimate down. This is what gives a repo a cost history at all; without it there is
          nothing to estimate from.
        additionalProperties:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              enum: [unavailable]
      cost_estimate:
        type: string
        minLength: 1
        description: >-
          What this run was told it would likely cost, BEFORE dispatching, derived from the mean
          per-member cost of this repo's own recorded councils. The literal `no-history` is valid and
          required for the first council in a repo: there is nothing to average, and a figure
          produced anyway would be invented. Deriving a cost from fan-out and rounds alone is
          forbidden outright — it reads as a measurement and is a guess, which `[safety-3]` prohibits.
      dispatch_depth:
        type: integer
        minimum: 1
        maximum: 1
        description: Always 1. Council members do not dispatch; recording it makes a nesting violation a stated fact rather than an inference from an unexpected bill.
      rounds_run:
        type: integer
        minimum: 0
      termination_reason:
        type: string
        description: >-
          Two reasons, because only two are reachable. A run either closed everything it opened
          (resolved) or it did not, in which case what remains belongs with the user
          (user-decision-required). max-rounds and no-progress were removed: both imply unfinished
          business, and a record carrying either had to declare its survivors, which in turn forced
          user-decision-required - so the only record that could carry them was one declaring
          nothing unfinished. Hitting the round bound is recorded by rounds_run against the resolved
          max_rounds, not by a termination reason.
        enum:
          - resolved
          - user-decision-required
      resolution:
        type: object
        additionalProperties: false
        description: >-
          The three resolved inputs that decided whether a council fired, recorded so the decision
          can be RE-DERIVED rather than merely asserted. Without these,
          a validator can confirm what mode was written down but not whether that mode was the
          correct consequence of the config - which is the whole of R1 and R7. Optional, because a
          brief written before councils existed has none; when present, the validator recomputes the expected
          mode and fails on disagreement.
        required:
          - dispatch_enabled
          - council_enabled
          - task_class
        properties:
          dispatch_enabled:
            type: string
            enum: [optional, disabled]
            description: The RESOLVED value, after tuning.dispatch.enabled overrides the global. Checked first - disabled suppresses the council in every phase.
          council_enabled:
            type: string
            enum: [on-for-complex, disabled]
            description: The RESOLVED council.enabled, after tuning.council.enabled overrides the global.
          task_class:
            type: string
            enum: [trivial, standard, complex]
      repo_integrity:
        type: object
        additionalProperties: false
        description: >-
          Filesystem-scoped digest of the repository taken before and after the council ran.
          Deliberately NOT git-scoped - `git status` reports clean for
          gitignored paths, and dist/ is both gitignored and the thing consumers actually install,
          so a git-based assertion passes green exactly where the damage would be invisible.
          Required whenever any member declared a sandbox, i.e. whenever a trial could have written.
        required:
          - before
          - after
          - algorithm
        properties:
          before:
            type: string
            minLength: 8
          after:
            type: string
            minLength: 8
          algorithm:
            type: string
            minLength: 3
            description: The digest tool and mode used, so a reader can reproduce it. Produced by validators/repo-digest.mjs.
      evidence_classes:
        type: object
        additionalProperties: false
        description: Per-class runtime availability. A class requested during classification but absent from this map is invalid - it must be recorded as unavailable rather than silently dropped.
        properties:
          repo:
            type: string
            enum: [used, unused, unavailable]
          trial:
            type: string
            enum: [used, unused, unavailable]
          web:
            type: string
            enum: [used, unused, unavailable]
          recall:
            type: string
            enum: [used, unused, unavailable]
