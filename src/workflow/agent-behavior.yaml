version: 1
kind: agent-behavior

canonical_source:
  workflow_root: workflow
  instructions_root: AGENTS.md
  rule: workflow/ is the canonical workflow root in a consumer repo.

task_classes:
  trivial:
    description: Single-location change with no architectural impact and no risk to other callers.
    classification_signals:
      - rename a variable or string literal in one file
      - fix a typo or comment
      - bump a version constant
      - reorder import statements
    required_phases: []
    skippable_phases:
      - think
      - plan
      - review
      - test
      - ship
      - reflect
    artifact_required: false
    note: Handle inline. No lifecycle artifact needed. Document the change in the response.
  standard:
    description: Multi-file or cross-function change with defined scope and no architectural decisions pending.
    classification_signals:
      - new feature or endpoint within an existing pattern
      - bug fix that touches multiple files
      - refactor within a bounded module
      - test suite addition or update
    required_phases:
      - think
      - plan
      - build
      - review
      - ship
      - reflect
    skippable_phases:
      - test
    skip_requires_waiver: true
    artifact_required: true
  complex:
    description: Cross-cutting change, new architectural pattern, or work requiring multiple independent workstreams.
    classification_signals:
      - new layer, service, or integration
      - schema or API contract change affecting multiple callers
      - change to authentication, authorization, or data model
      - work requiring parallel build workstreams
    required_phases:
      - think
      - plan
      - build
      - review
      - test
      - ship
      - reflect
    skippable_phases: []
    skip_requires_waiver: true
    artifact_required: true

lifecycle:
  default_mode: standard
  require_artifacts_for_standard_and_complex_work: true
  allow_skipped_phase_with_waiver: true
  artifact_chain:
    - artifact: brief
      phase: think
      path: workflow/artifacts/briefs/<slug>-v<N>.md
      next_phase: plan
    - artifact: plan
      phase: plan
      path: workflow/artifacts/plans/<slug>-v<N>.md
      next_phase: build
    - artifact: task
      phase: build
      path: workflow/artifacts/tasks/<slug>-v<N>.md
      next_phase: review
    - artifact: review
      phase: review
      path: workflow/artifacts/reviews/<slug>-v<N>.md
      next_phase: test
    - artifact: verify
      phase: test
      path: workflow/artifacts/verify/<slug>-v<N>.md
      next_phase: ship
    - artifact: ship
      phase: ship
      path: workflow/artifacts/ship/<slug>-v<N>.md
      next_phase: reflect
    - artifact: reflect
      phase: reflect
      path: workflow/artifacts/reflect/<slug>-v<N>.md
      next_phase: done

pause_resume:
  restore_from_artifacts_first: true
  never_continue_from_chat_memory_only: true
  unresolved_blockers_pause: true
  user_checkpoint_required_for:
    - brief-review
    - plan-review
    - ship-review

evidence_policy:
  no_external_claim_without_evidence: true
  command_success_requires_current_output_or_cited_artifact: true
  skipped_checks_are_risk: true
  blocked_or_not_run_checks_require_owner: true
  generated_output_requires_source_or_regeneration_evidence: true

change_policy:
  preserve_unrelated_changes: true
  stage_only_approved_scope: true
  default_branch_commit_requires_user_approval: true
  destructive_action_requires_user_approval: true
  external_write_requires_user_request_or_config: true

waivers:
  approvers:
    - user
    - configured_decision_owner
  required_fields:
    - waived_gate_or_requirement_id
    - reason
    - residual_risk
    - owner
    - follow_up_action
    - approval_evidence
  cannot_waive_false_evidence: true

dispatch:
  enabled: optional
  max_parallel_workstreams: 3
  require_independent_file_ownership: true
  require_dispatch_log: true
  merge_owner: primary_agent

# skill_scoring backs passive/scored power skills (WP-R4). There is no runtime that computes
# these values mechanically: the agent reads a requirement/diff, applies this rubric itself, and
# records the ran/skipped decision in the artifact's skill_trigger_log (see
# artifact-frontmatter.schema.yaml). A validator can only audit that a decision was recorded and
# justified for every skill whose trigger predicate evaluates true against the recorded signals —
# it cannot re-derive or verify the score itself.
#
# WP-R4 Wave 3 fills in the first 10 real entries below (C1-C3 explorers, D1-D7 domain experts) —
# every power skill shipped before Wave 3 (decompose-requirements, restore-context,
# dispatch-subagents, lifecycle-orchestrator, and the WP-R4 Wave 1/2 gate-bound skills) is either
# Active or Gate-bound, not Passive/scored, so had nothing to enter here. Predicate strings use
# `path~<category>_globs` as shorthand for "the diff touches a file matching that category's glob
# set" (verbatim from the resolved WP-R4 spec §5) — there is no runtime to evaluate this
# mechanically (see comment above); the agent applies the predicate itself and records the
# decision in skill_trigger_log. check-skill-triggers.mjs audits that the decision was recorded,
# never that the predicate was evaluated correctly.
skill_scoring:
  version: 1
  signals:
    files_touched:
      source: diff
      type: int
    ri_count:
      source: manifest
      type: int
    touches_protected:
      source: repo-profile.paths.protected
      type: bool
    touches_contract:
      source: repo-profile.paths.public_contracts
      type: bool
    touches_generated:
      source: repo-profile.paths.generated_outputs
      type: bool
    new_surface:
      source: diff
      type: bool
    task_class:
      source: classification
      type: string
  complexity_score:
    weights:
      files_touched:
        per_unit: 3
        cap: 30
      ri_count:
        per_unit: 4
        cap: 24
      touches_protected: 15
      touches_contract: 15
      new_surface: 10
      task_class:
        trivial: 0
        standard: 6
        complex: 6
  triggers:
    repo-alignment-scan: "complexity_score >= 40 OR new_surface OR task_class != trivial"
    architecture-decision-advisor: "complexity_score >= 60 OR touches_contract OR new_surface"
    constraint-conflict-scan: "task_class != trivial OR touches_protected"
    domain.interface-contract-designer: "path~contract_globs OR touches_contract"
    domain.data-schema-designer: "path~schema_globs"
    domain.system-design-advisor: "complexity_score >= 60 OR new_surface"
    domain.ui-ux-designer: "path~ui_globs"
    domain.clean-code-architect: "complexity_score >= 50"
    domain.quality-gates-validator: "task_class != trivial"
    domain.performance-optimizer: "path~hotpath_globs OR complexity_score >= 60"
  # path_glob_categories gives the `path~<category>_globs` trigger shorthand above a concrete,
  # checkable meaning — a starting, deliberately non-exhaustive set per category, editable without
  # touching the trigger predicates themselves. Used by check-trigger-predicates.mjs against
  # examples/power-skill-sandbox/ to catch a predicate or glob-category regression mechanically —
  # the one part of skill-trigger correctness that doesn't require an LLM to evaluate.
  path_glob_categories:
    contract_globs:
      - "**/routes/**"
      - "**/api/**"
      - "**/*.proto"
      - "**/openapi*.yaml"
      - "**/openapi*.yml"
      - "**/*.graphql"
      - "**/cli/**"
    schema_globs:
      - "**/migrations/**"
      - "**/schema/**"
      - "**/*.sql"
      - "**/models/**"
    ui_globs:
      - "**/components/**"
      - "**/views/**"
      - "**/screens/**"
      - "**/*.css"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
    hotpath_globs:
      - "**/hot/**"
      - "**/perf/**"

extensions: {}
