version: 1
kind: repo-profile

repository:
  mode: single-repository
  root: .
  default_branch: <PLACEHOLDER>
  workflow_root: workflow
  artifacts_root: workflow/artifacts
  learnings_sessions_root: workflow/learnings/sessions

branch_policy:
  require_non_default_branch_for_changes: true
  default_branch_commit_requires_user_approval: true
  preserve_unrelated_changes: true
  dirty_state_policy: record-and-preserve
  stage_only_approved_scope: true
  branch_name_pattern: <slug-or-phase>

paths:
  protected:
    # These patterns bind the AGENT, not the agentsmyth CLI. The distinction is written here
    # because it was previously implicit, and an agent that read this list as a description of
    # everything that will ever touch these paths would have been wrong about one file.
    #
    # The one CLI exception, stated rather than left to be discovered: `agentsmyth init` and
    # `agentsmyth upgrade` write the mandatory pre-commit hook, which in a default repo lives at
    # `.git/hooks/pre-commit` — inside the first pattern below. That is the gate's whole design:
    # git must run it whether or not an agent cooperates, so it has to sit where git looks. The
    # protection this list provides still holds in the direction that matters — a hook under
    # `.git/` is never hashed into `workflow/provenance.yaml` and never copied into the committed
    # `workflow/backups/` tree, precisely because doing so would move protected content into
    # version control. Set `core.hooksPath` to a tracked directory to move the hook out of `.git/`
    # entirely; agentsmyth honours it and will then govern the hook like any other file.
    - pattern: .git/**
      reason: repository metadata
    - pattern: .env*
      reason: potential secrets
    - pattern: '**/*secret*'
      reason: potential secrets
  public_contracts: []
  generated_outputs: []
  test_roots: ["<PLACEHOLDER>"]
  docs_roots: ["<PLACEHOLDER>"]
  source_roots: ["<PLACEHOLDER>"]

ownership:
  default_owner: user
  codeowners_file: null
  path_owners: []

commands:
  discovery:
    allow_repo_inspection: true
    prefer_configured_verification_commands: true
    do_not_invent_commands: true
  package_managers: []

generated_output_policy:
  require_source_mapping: true
  require_regeneration_or_waiver_when_source_changes: true
  manual_edits_allowed: only_when_configured

extensions: {}
