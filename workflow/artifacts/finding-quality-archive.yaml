  # ── WP-R18 Review council (2026-09-24) ──────────────────────────────────────────────────
  # 72 of 77 findings, closed proved-real. The review recommended hold; the user directed that
  # every severity be fixed, and Build Phase 12 did so — so "acting on it confirmed the finding"
  # is true of each one, which is what proved-real asserts.
  #
  # closed_in_phase is `review` for all 72, and that is the closest TRUE value rather than an
  # exact one: the fixes landed in Build Phase 12, AFTER Review, and the enum offers review,
  # test, ship and reflect with no member for a return to Build. The schema contemplates "a
  # finding fixed during the same review that raised it", which is what happened — the chain did
  # not move on between the raising and the fixing. The missing enum member is a follow-up for
  # Reflect, recorded rather than worked around silently.
