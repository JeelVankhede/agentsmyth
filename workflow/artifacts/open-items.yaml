  - id: OI-88
    source: follow-up
    owner: workflow owner
    next_action: "Sweep the validator set for `--dir` with a missing operand. check-pending-setup.mjs, check-config.mjs, check-assumptions.mjs and their siblings all read `args[args.indexOf('--dir') + 1]` with no guard, so a bare `--dir` silently resolves paths under the string \"undefined\" instead of failing. Developer-facing flag only — no consumer path reaches it — which is why this was noted rather than filed during the open-items-remediation Review. Fix as one sweep, not one validator at a time: a single validator guarding its operand while its siblings do not is worse than none guarding it, because it teaches that the flag is checked. Note the mutation ratchet: an added error is an added rule, and the baseline is at 0 undefended for every validator, so each new guard needs its own rejection fixture in the same change."
