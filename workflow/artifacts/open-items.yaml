    next_action: "Narrow check-waivers.mjs's unstructured-claim heuristic again. It rejected the wp-r20-ledger-closure chain's own artifacts TWICE, neither a waiver claim: once for prose quoting open-items.schema.yaml's `source` enum description (the quotation contains the word 'waived'), and once for the phrase 'none deferred, waived or dropped' - a sentence whose entire content is that there are NO waivers, which is the inverse of what the heuristic looks for. This is the same class already recorded in this ledger, which a prior chain narrowed for 'rather than' constructions and which had previously caused a real GitHub Actions CI failure. Four data points now. Two candidate directions: exempt a quoted span, and treat a leading 'no'/'none' quantifier before the waiver word as a negation the way 'rather than' already is. Note the mutation ratchet - check-waivers is at 3 rules, 0 undefended, so any added error needs its own rejection fixture in the same change."
    status: open
