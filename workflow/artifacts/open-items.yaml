    owner: workflow owner
    next_action: "check-scope-fence cannot resolve a Touches entry written as prose, and the failure is one-directional in a way worth closing. The existing rule checks that each DECLARED path is a real repo-relative path. wp-r20-ledger-closure-v1's plan wrote Phase 6's Touches as '`SKILL.md` + both references', which names two real files in prose; the fence reported both as outside the declared Touches when they were changed. That is the inverse hole - a real changed file that no declared path names - and the diagnosis pointed at the changed file rather than at the unparseable Touches line, which is where the defect was. Consider having check-scope-fence reject a Touches line containing a non-path token, so the plan fails at the phase that wrote it rather than at the phase that acts on it. Mutation ratchet: check-scope-fence is at 5 rules, 0 undefended; an added error needs its own fixture."
