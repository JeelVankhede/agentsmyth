  - id: OI-74
    source: follow-up
    owner: workflow owner
    next_action: "The mandatory pre-commit lifecycle gate makes incremental Build commits impossible. .githooks/pre-commit maps a staged `tasks/` artifact to the `review` phase gate, which requires status ready-for-next-phase — but a task artifact is legitimately `in-progress` for the whole of Build, and lifecycle-build's own output-schema says Plan Phases Overview is 'updated at the start of each new Build phase', which implies committing it repeatedly. Today the only ways through are one giant end-of-Build commit or routine `--no-verify`, and routine bypass of a mandatory gate is corrosive — it trains the habit the gate exists to prevent. Hit on wp-r21-think-council Phase 1 (of 7), bypassed deliberately once with the reason in the commit message. Options: map `tasks/` to no gate while status is in-progress and to `review` only when it flips to ready-for-next-phase; or gate on the task's own phase rather than its downstream phase. Prefer the former — it preserves the check that matters (a task claiming review-readiness must actually be ready) without blocking the normal Build loop."
    status: open
    first_seen_run: wp-r21-think-council-v1
  - id: OI-73
    source: follow-up
    owner: workflow owner
    next_action: "check-lifecycle.mjs's checkpoint evidence extractor cannot record a multi-line verbatim user quote. The regex at line 62 terminates on `(?=\\n-\\s|\\n*$)`, and with the /m flag `$` matches at the first line end, so a multi-line approval truncates to its first line — which then usually trips the `length < 10` placeholder check. Hit live on wp-r21-think-council-v1: the user's real approval spanned four lines and had to be quoted as its final sentence, with the remainder recorded separately in prose. Users approve in multi-line messages routinely, so the rule 'quote the user verbatim' is currently in tension with what the validator can store. Fix the lookahead to terminate only on a following `- ` bullet at column 0, or support an indented continuation block."
    status: open
    first_seen_run: wp-r21-think-council-v1
