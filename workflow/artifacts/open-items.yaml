    next_action: "Reassess whether `closed_in_run` earns its place once entries closed under the new contract accumulate. wp-r20-ledger-closure-v1 added the field and backfilled 70 archived items: 5 carry a real slug-vN, derived only where the closure prose named exactly one chain other than first_seen_run (OI-29, OI-35, OI-37, OI-38, OI-52), and 65 carry the literal `unrecorded`. One item (OI-40) named two candidate chains and was marked unrecorded rather than guessed at. So the field is real but currently 93% empty of signal, and its migration value - telling which chain closed an item - is unproven until chains close items under the new rule. Revisit after several chains have done so; if it is still mostly unrecorded then, the field is not being written and the fix is in the skill rather than the schema."
