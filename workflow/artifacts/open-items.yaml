  - id: OI-40
    source: follow-up
    owner: wp-r12
    next_action: "check-release-readiness.mjs has two compounding bugs, found while closing out wp-r11-docs-site-v1's ship artifact. (1) declaredRecommendation() does a naive substring search over the whole Ship Status section in RECOMMENDATION_WORDS priority order ['hold-with-waiver','hold','ship'] -- any mention of the word 'hold' anywhere in that section (e.g. citing Verify's own prior recommendation for context, which is legitimate prose) gets misdetected as the artifact's own declared recommendation, silently skipping the blockers and P0/P1 checks that only run when 'ship' is correctly detected. (2) Even once that's fixed, the P0/P1 cross-check treats any non-zero P0/P1 count in a review's Severity Summary as an open, unwaived blocker, with no way to recognize a finding explicitly marked resolved (e.g. 'confirmed and fixed post-Test') -- this directly contradicts lifecycle-ship/SKILL.md's own Workflow step 6a (resolved-fix vs. open-risk classification, added by an earlier chain specifically to prevent fabricating waivers for already-fixed findings), which check-release-readiness.mjs was apparently never updated to implement. User explicitly assigned this fix to wp-r12 rather than wp-r11 (out of wp-r11's scope, and to avoid repeating the same-branch scope mistake made with the bin/agentsmyth.mjs packaging fix). Done: fixed in wp-r12-local-install-fixes-v1 Phase 2 -- declaredRecommendation() now parses the actual \"- Recommendation:\" line (with a fallback for pre-schema-convention prose artifacts), and the P0/P1 cross-check recognizes findings explicitly marked resolved (\"(fixed)\", \"confirmed and fixed\") in the established bold-inline position. Verified against all real shipped Ship artifacts (found and fixed a second, previously-unknown instance of the same bug: power-skills-wave2-v1.md) and the existing o-ship-with-open-p1 violation fixture."
    status: done
    first_seen_run: wp-r11-docs-site-v1
