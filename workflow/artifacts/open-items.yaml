    next_action: "lifecycle-build/SKILL.md's scope-before-work rule (PR #44) is prose-only, same category of limitation workflow/rules.md's Approval section had before the checkpoint-approval gate (R5, wp-r12-local-install-fixes-v1) existed. Watch whether the strengthened wording is actually followed in future Build phases; if it keeps getting skipped, it likely needs the same two-layer treatment (a mechanical check backing the prose), not just clearer wording. ASSESSED 2026-07-26: recommend yes, escalate to a mechanical check, with one nuance the check must handle. On site-docs-remediation-v1, Build's task artifact (workflow/artifacts/tasks/site-docs-remediation-v1.md) was in fact written to document nine file edits that were already staged in the working tree before that Build phase began -- on its face, exactly the failure pattern this rule exists to prevent. But the edits predated this agent's involvement in that turn entirely (resumed from earlier session state, not written and then retroactively documented by the same agent in one continuous pass), so 'scope before work' had no earlier point to intervene at. A naive mechanical check comparing the task artifact's created/updated timestamp against the first file modification in git history (OI-50's own original suggestion) would flag this as a violation when it structurally could not have been avoided. Recommendation: the check needs to distinguish 'artifact written after implementation within the same agent session/turn' (a real violation) from 'agent resumes a session where implementation already predates its own involvement' (unavoidable, should not fail) -- e.g. by checking whether the offending file diffs were already present in git status at the very first tool call of the session, not just comparing raw timestamps."
