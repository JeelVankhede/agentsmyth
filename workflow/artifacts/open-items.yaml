    next_action: "check-artifacts.mjs extracts a brief's Requirement Manifest with /## Requirement Manifest[\\s\\S]*?(?=\\n## |\\n---|\\s*$)/, which is not anchored to a line start. A brief that MENTIONS the heading inline - e.g. the sentence 'See `## Requirement Manifest`' in a Requirements section - matches first, captures a 26-character section containing no IDs, and every manifest_id in the downstream task artifact is then reported as 'not declared in the upstream brief'. The error names the task artifact, so the diagnosis points away from the actual cause, which is in the brief. Hit by wp-r24-enforcement-proof-v1 and worked around by rewording the brief, which leaves the trap set. Anchor the pattern to a line start (/^## Requirement Manifest/m) and add a violation fixture for a brief that references the heading inline. Note the mutation ratchet is at 0 undefended, so a new rule needs its own rejection fixture in the same change."
