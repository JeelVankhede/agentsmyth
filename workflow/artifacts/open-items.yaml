  - id: OI-99
    source: follow-up
    owner: workflow owner
    next_action: "A bare validator invocation in THIS repo silently validates against the global install rather than the source being edited, and nothing says so. lib.mjs resolves definitions via defsPath() -> definitions_root, which workflow/config/repo-profile.yaml sets to ~/.agentsmyth/workflow. So `node src/workflow/validators/check-open-items.mjs` after a schema edit reports ok against the PRE-EDIT global schema. Hit live in wp-r20-ledger-closure-v1 Phase 1: the phase gate passed and proved nothing, and was only caught by deliberately probing whether the new assertion could fail. AGENTSMYTH_HOME=src/workflow is the correct override (moves definitions, leaves the data root on workflow/); AGENTSMYTH_WF=src/workflow moves BOTH roots and produces a different false pass, 'no open-items.yaml - no follow-ups persisted yet'. Two plausible invocations, two green results, neither about the edit. src/workflow/validators/README.md documents the bare form. Fix by either correcting the README's examples for this repo, or having lib.mjs report which definitions root it resolved when that root is not the repo-local one."
    status: open
    first_seen_run: wp-r20-ledger-closure-v1
  - id: OI-100
    source: follow-up
    owner: workflow owner
    next_action: "agent-behavior.yaml's skill_scoring.path_glob_categories.schema_globs is ['**/migrations/**', '**/schema/**', '**/*.sql', '**/models/**'] and does not match this repo's own src/workflow/schemas/ directory - 'schemas' is not 'schema'. The consequence is that the `path~schema_globs` trigger, and therefore data-schema-designer, is mechanically FALSE for every schema change agentsmyth makes to itself, including the one in wp-r20-ledger-closure-v1 that added two fields to a schema shipped to consumer repos. That chain ran the skill anyway and recorded the near-miss in its Plan skill_trigger_log rather than letting a typo decide. Decide whether to add '**/schemas/**' to the category. Note this is a behavior change to a shipped file with its own conformance surface: check-trigger-predicates.mjs validates the predicates against examples/power-skill-sandbox/expected-triggers.yaml, so the fixture's expectations move with it."
