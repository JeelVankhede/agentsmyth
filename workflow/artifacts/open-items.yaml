  - id: OI-83
    source: follow-up
    owner: workflow owner
    next_action: "Explain why commit 537eebb passed the mandatory pre-commit gate while staging two files (test/run-mutation-audit.mjs, test/mutation-baseline.json) that no task artifact's Changed Files covered, then close the hole or the record-keeping error it exposes. What was verified: the hook is installed (core.hooksPath=.githooks); it invokes `agentsmyth` from PATH, which is a GLOBALLY INSTALLED 1.0.0 package rather than this repo's bin/; that CLI resolves validators from ~/.agentsmyth/workflow/validators, whose check-commit-coverage.mjs is byte-identical to the repo source; and the gate DOES fire correctly - staging an uncovered test/*.mjs probe produced the expected rejection naming the path. Both files were in 537eebb and neither is covered. The cause is therefore not a missing hook, a stale validator, or a broken rule, and I could not determine it. Two things worth fixing regardless. (1) A gate that fires on a probe but not on a real commit is worse than no gate, because it is trusted; reproduce it deliberately before relying on the gate for scope discipline again. (2) The hook resolves `agentsmyth` from PATH, so the gate a developer experiences depends on which version they happen to have installed globally - here a 1.0.0 package that ships only three validators - rather than on the repo being developed. Consider preferring the repo's own bin/ when one exists, so the gate tests the code under change.REPRODUCED AND NARROWED 2026-09-08, during the Review of open-items-remediation-v1 (finding F2). A second instance exists on branch chore/open-items-triage-1.1.0: commit b4db7c6 added test/run-domain-placeholders-tests.mjs, which no task artifact's Changed Files covers anywhere in the repo, and it committed. The rule was recomputed for BOTH commits by re-implementing coveredPaths()/isCovered() over the task artifacts as they existed at each commit: at 537eebb, 4 gated paths of which test/run-mutation-audit.mjs and test/mutation-baseline.json are uncovered; at b4db7c6, one uncovered path of 81 gated. The rule would have rejected both. Also checked and excluded: the trivial-size escape (both commits staged more than one gated file), .githooks/pre-commit's mode (100755 at 537eebb and at HEAD), core.hooksPath (set to .githooks), and whether the globally installed CLI supports check --staged (it does). So the rule is correct, the validator is correct, and the hook is installed and executable — what did not happen is EXECUTION. The most plausible remaining cause is `git commit --no-verify`, which leaves no trace in git history, and that is precisely why this item should not be closed on the reproduction alone. The second half of this item's recommendation IS now implemented: bin/agentsmyth.mjs's resolveValidator() prefers the repository's own src/workflow/validators/ when the repo being checked IS the package, so the gate no longer runs the previously installed copy of a validator under change (verified by marker experiment, and pinned by conformance checks r8-source-precedence and r8-consumer-precedence). Remaining next action, narrowed: make a local bypass visible centrally rather than trying to prevent it — the coverage rule needs a range mode (compare a commit range against task coverage) so CI can re-run it on the PR head, where --no-verify has no effect. That is a new capability in a shipped validator and belongs in its own chain."
    status: open
    first_seen_run: wp-r22-review-council-v1
