  - id: OI-102
    source: requirement
    owner: user
    next_action: "Watch for a consumer repo hitting the one upgrade tightening in the open-items ledger change. wp-r20-ledger-closure-v1 set `additionalProperties: false` on the item object, so a ledger carrying an agent-invented key other than `resolution` now fails where it previously passed. RI5's acceptance was that upgrade is a no-op, and it is a no-op in every other respect, so that requirement is recorded as `partial` rather than shipped across the review, verify, ship and reflect artifacts. Deferral was DECLINED, not unavailable - an earlier wording of this item said it could not be deferred, and that was wrong. lib.mjs honours `x_enforcement: warn-until-<version>` on the schema-valued form (lib.mjs:825), and `additionalProperties: {x_enforcement: warn-until-1.2.0, enum: []}` is unsatisfiable for every value (lib.mjs:671), so each undeclared key would route through deferredWarnings rather than errors. It was rejected on design grounds: a warn window reopens the exact hole this change closes, because `resolution` reached 39 of 92 entries precisely by validating silently, and a key that warns for a release is a key that validates silently for a release. It should not be removed: an open object is the CAUSE of the defect the change fixes - `resolution` reached 39 of 92 entries by validating silently. Expected impact nil, since `resolution` is the only invented key ever observed and is now declared, and a failure names the offending key exactly. Named in CHANGELOG.md so a consumer meets it as documentation. No action unless a report arrives."
