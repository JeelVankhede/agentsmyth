    next_action: "check-scope-fence reads the ACTIVE PHASE NUMBER out of a task artifact's '## Active Phase' section, and a line written as prose fails the gate with 'no parseable phase number'. Three consecutive chains have now hit this at exactly the same moment - the handoff edit at the end of Build, when the line is rewritten to say the phase is complete: wp-r22-review-council-v1, wp-r23-agents-md-fallback-v1 and wp-r24-enforcement-proof-v1. Each rediscovered it from the same error message, and wp-r23 wrote a warning into its own artifact, which did not reach the next author because nothing carries an artifact comment forward. Fix where the next author will actually meet it: state the constraint in the lifecycle-build starter block next to the Active Phase field, or make the validator's message name the required shape ('expected: Phase <N> - <name>'). An artifact comment is not a fix for a recurring authoring trap."
