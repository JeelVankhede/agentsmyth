# npm Trusted Publishing (OIDC). https://docs.npmjs.com/trusted-publishers
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  id-token: write
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Node 20 bundles npm 10.x, which does not perform the OIDC token exchange
      # for Trusted Publishing (requires npm >= 11.5.1). Without this, `npm publish`
      # runs unauthenticated and the registry returns a masked E404.
      # Pin to npm 11: it has OIDC support and still runs on Node 20
      # (node ^20.17.0 || >=22). npm 12 drops Node 20 (requires node ^22 || ^24).
      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@11

      - name: Verify
        run: |
          npm ci
          node scripts/build-bundle.mjs
          node scripts/validate-template.mjs
          node scripts/validate-example.mjs
          npm run violations:test
          npm run conformance:test
          npm run root-resolution:test
          npm run setup-checks:test
          npm run setup-refs:test
          npm run init-prepare-interop:test
          npm run checkpoint-approval:test
          npm run setup-validator-definitions-root:test
          npm run tuning-merge:test
          npm run commit-coverage:test

      # Deliberately here and not in ci.yml. The audit mutates every validator rule in turn and
      # re-runs three suites for each, so it costs tens of minutes — too slow for every push, and
      # exactly why it is named `mutation:audit` rather than `:test`. But a coverage ratchet that
      # never runs is not a ratchet, and a release is the one moment the question "would the suite
      # notice if this rule stopped working" has to have a current answer.
      - name: Mutation audit (coverage ratchet)
        run: npm run mutation:audit

      - name: Bump version
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$VERSION"

      - name: Pack tarball
        run: npm pack

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }}"

      - name: Tag
        run: git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"

      - name: Publish to npm (OIDC)
        run: npm publish --access public

      - name: Push main and tag
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            *.tgz
            dist/setup-bundle.md
            dist/workflow-bundle.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
