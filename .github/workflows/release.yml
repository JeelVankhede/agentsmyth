name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version from package.json
        id: version
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.value }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundles
        if: steps.tag_check.outputs.exists == 'false'
        run: node scripts/build-bundle.mjs

      - name: Validate templates
        if: steps.tag_check.outputs.exists == 'false'
        run: node scripts/validate-template.mjs

      - name: Validate examples
        if: steps.tag_check.outputs.exists == 'false'
        run: node scripts/validate-example.mjs

      - name: Pack tarball
        if: steps.tag_check.outputs.exists == 'false'
        run: npm pack

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: |
            *.tgz
            dist/setup-bundle.md
            dist/workflow-bundle.md
          generate_release_notes: true
