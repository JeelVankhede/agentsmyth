name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build bundles
        run: node scripts/build-bundle.mjs

      - name: Validate templates
        run: node scripts/validate-template.mjs

      - name: Validate examples
        run: node scripts/validate-example.mjs

      - name: Run violation tests
        run: npm run violations:test

      - name: Run conformance tests
        run: npm run conformance:test
