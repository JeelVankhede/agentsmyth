name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    # Release branches are integration targets — every WP for a minor release merges into one
    # before main sees a single commit. Filtering to main meant those PRs ran zero checks and every
    # number in their description came from one developer's machine.
    branches: [main, 'release/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: node scripts/build-bundle.mjs

      - name: Validate templates
        run: node scripts/validate-template.mjs

      - name: Validate examples
        run: node scripts/validate-example.mjs

      - name: Run violation tests
        run: npm run violations:test

      - name: Run conformance tests
        run: npm run conformance:test

      - name: Run setup-completion tests
        run: npm run setup-checks:test

      - name: Run setup-reference tests
        run: npm run setup-refs:test

      - name: Run root-resolution drift tests
        run: npm run root-resolution:test

      - name: Run init/prepare interoperability tests
        run: npm run init-prepare-interop:test

      - name: Run checkpoint-approval gate tests
        run: npm run checkpoint-approval:test

      # Added after a Review-council finding: both suites existed in package.json and ran in no
      # workflow, so they were counted as coverage while never being invoked. tuning-merge in
      # particular carries the only automated evidence for per-repo council tuning.
      - name: Run tuning-merge tests
        run: npm run tuning-merge:test

      - name: Run commit-coverage tests
        run: npm run commit-coverage:test

      - name: Run domain-placeholder tests
        run: npm run domain-placeholders:test

      - name: Run setup-validator definitions_root tests
        run: npm run setup-validator-definitions-root:test

      - name: Build docs site
        run: npm run site:build
